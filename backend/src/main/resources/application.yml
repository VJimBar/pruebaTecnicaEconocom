server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Configuración JWT (se enlaza con la clase JwtProperties)
jwt:
  # Clave HMAC en Base64. Mínimo 32 bytes al decodificar.
  # En un entorno real se leería de una variable de entorno o de un gestor de secretos.
  secret: Y2xhdmUtc2VjcmV0YS1wYXJhLWxhLXBydWViYS10ZWNuaWNhLWVjb25vY29tLTIwMjYtbm8tdXNhci1lbi1wcm9kdWNjaW9u
  # Vida del access token:(para probar la caducidad, 15000 = 15 s)
  access-expiration-ms: 15000
  # Vida del refresh token: 7 días
  refresh-expiration-ms: 604800000

auth:
  sso:
    # URL de retorno Angular del proveedor SSO simulado.
    redirect-uri: http://localhost:4200/sso/callback
